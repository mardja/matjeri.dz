<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>تاجر | تسيير المبيعات</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0B5E47">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="تاجر">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@500;700;900&family=Tajawal:wght@400;500;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jsbarcode/3.11.6/JsBarcode.all.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/quagga/0.12.1/quagga.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-5403471704239091" crossorigin="anonymous"></script>
<style>
:root{
  --bg:#EEF4F1; --surface:#fff; --surface-2:#E4EEE9;
  --primary:#0B5E47; --primary-dark:#073D2E; --primary-light:#0E7558;
  --primary-soft:#DCF0E6;
  --accent:#D98A1E; --accent-soft:#FAF0DC;
  --danger:#BF3A2A; --danger-soft:#F7E5E2;
  --ink:#162520; --ink-2:#2E4039; --muted:#6B7D76;
  --border:#D2E2D8;
  --shadow:0 1px 3px rgba(0,0,0,0.05),0 2px 10px rgba(11,94,71,0.07);
  --shadow-md:0 4px 18px rgba(11,94,71,0.13);
  --r:16px; --r-sm:10px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0;}
html,body{background:var(--primary-dark);font-family:'Tajawal',sans-serif;color:var(--ink);}
body{display:flex;justify-content:center;min-height:100vh;}
.mono{font-family:'IBM Plex Mono',monospace;font-variant-numeric:tabular-nums;}
h1,h2,h3,.display{font-family:'Cairo',sans-serif;}
#app{width:100%;max-width:480px;min-height:100vh;background:var(--bg);position:relative;display:flex;flex-direction:column;overflow-x:hidden;}

/* ── TOPBAR ── */
.topbar{
  position:sticky;top:0;z-index:20;
  background:linear-gradient(135deg,var(--primary-light) 0%,var(--primary-dark) 100%);
  color:#fff;padding:14px 16px 12px;
  display:flex;align-items:center;gap:10px;
  box-shadow:0 4px 16px rgba(7,40,28,0.22);
}
.topbar .t-back,.topbar .t-action{
  width:36px;height:36px;border-radius:50%;border:none;
  background:rgba(255,255,255,0.13);color:#fff;
  font-size:18px;display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;
}
.topbar .t-title{flex:1;font-size:17px;font-weight:900;font-family:'Cairo',sans-serif;letter-spacing:-0.3px;}
.topbar .t-sub{font-size:11px;opacity:0.7;font-weight:500;}
.topbar .t-spacer{width:36px;flex-shrink:0;}

/* ── PAGE ── */
.page{padding:14px 14px 100px;flex:1;}
.hidden{display:none!important;}

/* ── HERO CARD (dashboard receipt) ── */
.hero{
  background:linear-gradient(140deg,var(--primary) 0%,var(--primary-dark) 100%);
  border-radius:20px;padding:20px;color:#fff;
  position:relative;overflow:hidden;margin-bottom:14px;
  box-shadow:var(--shadow-md);
}
.hero::before{content:"";position:absolute;top:-30px;left:-30px;width:120px;height:120px;border-radius:50%;background:rgba(255,255,255,0.05);}
.hero::after{content:"";position:absolute;bottom:-20px;right:-20px;width:90px;height:90px;border-radius:50%;background:rgba(255,255,255,0.04);}
.hero .h-label{font-size:11.5px;opacity:0.75;margin-bottom:4px;}
.hero .h-amount{font-size:32px;font-weight:700;font-family:'IBM Plex Mono',monospace;letter-spacing:-1px;margin-bottom:8px;}
.hero .h-row{display:flex;justify-content:space-between;font-size:11.5px;opacity:0.8;}
.hero .h-badge{background:rgba(255,255,255,0.15);border-radius:20px;padding:2px 10px;font-size:11px;display:inline-block;}

/* ── STAT GRID ── */
.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px;}
.stat-card{background:var(--surface);border-radius:var(--r);padding:14px 13px;box-shadow:var(--shadow);}
.stat-card .sc-icon{font-size:22px;margin-bottom:6px;}
.stat-card .sc-val{font-size:19px;font-weight:800;font-family:'IBM Plex Mono',monospace;color:var(--ink);margin-bottom:1px;}
.stat-card .sc-label{font-size:11px;color:var(--muted);}
.stat-card.sc-alert .sc-val{color:var(--danger);}
.stat-card.sc-good .sc-val{color:var(--primary);}

/* ── SECTION TITLE ── */
.sec{display:flex;align-items:center;gap:8px;margin:18px 0 10px;}
.sec span{font-size:13px;font-weight:800;color:var(--ink-2);white-space:nowrap;}
.sec::after{content:"";flex:1;height:1.5px;background:var(--border);border-radius:2px;}

/* ── CARDS ── */
.card{background:var(--surface);border-radius:var(--r);padding:14px;margin-bottom:12px;box-shadow:var(--shadow);}

/* ── LIST ITEMS ── */
.li{
  background:var(--surface);border-radius:14px;padding:11px 13px;
  margin-bottom:8px;display:flex;align-items:center;gap:11px;
  cursor:pointer;box-shadow:var(--shadow);
  transition:background .12s;
}
.li:active{background:var(--surface-2);}
.av{
  width:42px;height:42px;border-radius:12px;
  background:var(--primary-soft);color:var(--primary-dark);
  display:flex;align-items:center;justify-content:center;
  font-weight:900;font-family:'Cairo',sans-serif;font-size:14px;flex-shrink:0;
}
.av.danger{background:var(--danger-soft);color:var(--danger);}
.av.accent{background:var(--accent-soft);color:#7a4d0a;}
.li-body{flex:1;min-width:0;}
.li-title{font-weight:700;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.li-sub{font-size:11.5px;color:var(--muted);margin-top:1px;}
.li-end{text-align:left;flex-shrink:0;}
.li-amount{font-weight:700;font-size:13px;font-family:'IBM Plex Mono',monospace;}

/* ── BADGES ── */
.badge{display:inline-block;font-size:10px;padding:2px 8px;border-radius:20px;font-weight:700;margin-top:3px;}
.badge.low{background:var(--danger-soft);color:var(--danger);}
.badge.ok{background:var(--primary-soft);color:var(--primary-dark);}
.badge.debt{background:var(--accent-soft);color:#7a4d0a;}
.badge.paid{background:#E3F7ED;color:#1a8c5b;}

/* ── SEARCH ── */
.search{
  display:flex;align-items:center;gap:8px;
  background:var(--surface);border-radius:13px;padding:10px 14px;
  margin-bottom:13px;box-shadow:var(--shadow);
}
.search input{border:none;outline:none;background:none;flex:1;font-size:14px;font-family:'Tajawal',sans-serif;color:var(--ink);}

/* ── BUTTONS ── */
.btn{border:none;border-radius:13px;padding:13px 16px;font-size:14px;font-weight:700;font-family:'Tajawal',sans-serif;cursor:pointer;width:100%;display:flex;align-items:center;justify-content:center;gap:6px;}
.btn-primary{background:var(--primary);color:#fff;}
.btn-primary:active{background:var(--primary-dark);}
.btn-outline{background:var(--surface);color:var(--primary-dark);border:1.5px solid var(--primary);}
.btn-danger{background:var(--danger-soft);color:var(--danger);}
.btn-ghost{background:var(--surface-2);color:var(--ink-2);}
.btn-sm{padding:9px 12px;font-size:12px;width:auto;border-radius:9px;}
.r2{display:flex;gap:10px;}.r2>*{flex:1;}
.icon-btn{width:44px;flex-shrink:0;border:1.5px solid var(--border);border-radius:11px;background:#fff;font-size:17px;display:flex;align-items:center;justify-content:center;cursor:pointer;height:44px;}
.icon-btn.primary{background:var(--primary);border-color:var(--primary);color:#fff;}

/* ── FAB ── */
.fab{
  position:fixed;bottom:90px;z-index:15;
  right:calc(50% - 228px);
  width:56px;height:56px;border-radius:50%;
  background:var(--accent);color:#fff;border:none;font-size:26px;
  box-shadow:0 6px 20px rgba(217,138,30,0.45);
  display:flex;align-items:center;justify-content:center;cursor:pointer;
}
@media(max-width:480px){.fab{right:16px;}}

/* ── BOTTOM NAV ── */
.bnav{
  position:fixed;bottom:0;left:50%;transform:translateX(-50%);
  width:100%;max-width:480px;
  background:var(--surface);
  border-top:1px solid var(--border);
  display:flex;padding:6px 4px calc(6px + env(safe-area-inset-bottom));
  z-index:20;box-shadow:0 -4px 16px rgba(0,0,0,0.06);
}
.nb{background:none;border:none;flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:4px 0;cursor:pointer;position:relative;}
.nb .ni{font-size:20px;line-height:1;}
.nb .nl{font-size:10px;font-family:'Tajawal',sans-serif;font-weight:600;color:var(--muted);}
.nb.active .nl{color:var(--primary);}
.nb.active .ni{filter:none;}
.nb.active::after{content:"";position:absolute;bottom:-6px;left:25%;width:50%;height:3px;background:var(--primary);border-radius:3px 3px 0 0;}

/* ── MODAL/SHEET ── */
.overlay{position:fixed;inset:0;background:rgba(10,22,18,0.5);display:flex;align-items:flex-end;justify-content:center;z-index:50;}
.sheet{background:var(--bg);width:100%;max-width:480px;border-radius:22px 22px 0 0;max-height:90vh;overflow-y:auto;padding:18px 16px calc(20px + env(safe-area-inset-bottom));animation:sup .22s ease-out;}
@keyframes sup{from{transform:translateY(30px);opacity:0;}to{transform:translateY(0);opacity:1;}}
.sh-handle{width:36px;height:4px;background:var(--border);border-radius:4px;margin:0 auto 16px;}
.sheet h3{font-size:16px;margin-bottom:14px;}

/* ── FORM FIELDS ── */
.field{margin-bottom:12px;}
.field label{display:block;font-size:12px;color:var(--muted);font-weight:700;margin-bottom:5px;}
.field input,.field select,.field textarea{
  width:100%;border:1.5px solid var(--border);border-radius:11px;
  padding:11px 12px;font-size:14px;font-family:'Tajawal',sans-serif;
  background:#fff;color:var(--ink);
}
.field input:focus,.field select:focus{outline:none;border-color:var(--primary);}
.seg{display:flex;border:1.5px solid var(--border);border-radius:11px;overflow:hidden;background:#fff;}
.seg button{flex:1;border:none;background:transparent;padding:10px;font-size:12.5px;font-family:'Tajawal',sans-serif;font-weight:700;color:var(--muted);cursor:pointer;}
.seg button.on{background:var(--primary);color:#fff;}
.bc-row{display:flex;gap:8px;align-items:stretch;}.bc-row input{flex:1;}
.bc-prev{text-align:center;margin:6px 0;}.bc-prev svg{max-width:100%;}

/* ── CART ── */
.cart-item{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--border);}
.qty-inp{width:58px;text-align:center;border:1.5px solid var(--border);border-radius:9px;padding:7px 4px;font-size:15px;font-family:'IBM Plex Mono',monospace;font-weight:700;background:#fff;color:var(--ink);}
.qty-inp:focus{outline:none;border-color:var(--primary);}
.pick-row{display:flex;align-items:center;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--border);}

/* ── SCAN STRIP ── */
.scan-strip{display:flex;gap:8px;align-items:center;background:var(--primary-soft);border:1.5px dashed var(--primary);border-radius:13px;padding:10px 12px;margin-bottom:13px;}
.scan-strip input{flex:1;border:none;background:none;outline:none;font-size:14px;font-family:'IBM Plex Mono',monospace;color:var(--primary-dark);}

/* ── CHART ── */
.chart-wrap{background:var(--surface);border-radius:var(--r);padding:14px;margin-bottom:12px;box-shadow:var(--shadow);}
.chart-wrap canvas{display:block;width:100%!important;}

/* ── KV ROWS ── */
.kv{display:flex;justify-content:space-between;align-items:baseline;font-size:13px;padding:6px 0;}
.kv .k{color:var(--muted);}
.kv .v{font-weight:700;font-family:'IBM Plex Mono',monospace;}
.divider{height:1px;background:var(--border);margin:4px 0;}

/* ── TOAST ── */
.toast{position:fixed;bottom:100px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:11px 22px;border-radius:30px;font-size:13px;z-index:80;box-shadow:0 6px 18px rgba(0,0,0,0.25);animation:tst 2.3s forwards;}
@keyframes tst{0%{opacity:0;transform:translate(-50%,8px);}12%{opacity:1;transform:translate(-50%,0);}85%{opacity:1;}100%{opacity:0;}}

/* ── EMPTY STATE ── */
.empty{text-align:center;padding:48px 20px;color:var(--muted);}
.empty .ei{font-size:40px;margin-bottom:10px;}
.empty .et{font-size:14px;font-weight:700;color:var(--ink-2);}
.empty .es{font-size:12px;margin-top:4px;}

/* ── AD SLOT ── */
.ad-slot{background:var(--surface);border-radius:14px;padding:10px 12px 12px;margin-bottom:8px;overflow:hidden;box-shadow:var(--shadow);}
.ad-label{font-size:10px;color:var(--muted);font-weight:700;margin-bottom:6px;}

/* ── LOCK SCREEN ── */
#lockScreen{position:fixed;inset:0;z-index:999;background:linear-gradient(160deg,var(--primary-dark),var(--primary));display:flex;align-items:center;justify-content:center;padding:24px;}
.lock-card{background:var(--surface);border-radius:22px;padding:30px 24px;width:100%;max-width:340px;text-align:center;box-shadow:0 20px 50px rgba(0,0,0,0.35);}
.lock-icon{width:66px;height:66px;border-radius:18px;background:var(--primary-soft);display:flex;align-items:center;justify-content:center;font-size:32px;margin:0 auto 14px;}
.lock-card h2{font-size:18px;margin-bottom:6px;}
.lock-card p{font-size:12.5px;color:var(--muted);margin-bottom:18px;line-height:1.6;}
.lock-card input{width:100%;text-align:center;letter-spacing:3px;font-size:17px;border:1.5px solid var(--border);border-radius:12px;padding:14px;font-family:'IBM Plex Mono',monospace;margin-bottom:12px;background:#fff;color:var(--ink);}
.lock-card input.shake{animation:shk .35s;border-color:var(--danger);}
@keyframes shk{0%,100%{transform:translateX(0);}25%{transform:translateX(-6px);}75%{transform:translateX(6px);}}
.lock-err{color:var(--danger);font-size:12px;margin:-4px 0 10px;min-height:16px;}

/* ── PRINT ── */
#printArea{display:none;}
@media print{
  body *{visibility:hidden;}
  #printArea,#printArea *{visibility:visible;}
  #printArea{display:block;position:absolute;top:0;right:0;left:0;}
  @page{size:var(--thermal-w,58mm) auto;margin:2mm;}
}
::-webkit-scrollbar{display:none;}
/* ── QUICK SALE ── */
.qs-wrap{display:flex;flex-direction:column;overflow:hidden;padding:0;margin:-14px -14px -100px;}
.qs-top{padding:10px 12px;background:var(--surface);border-bottom:1px solid var(--border);flex-shrink:0;}
.qs-scan{display:flex;gap:8px;align-items:center;background:var(--primary-soft);border:1.5px dashed var(--primary);border-radius:12px;padding:9px 12px;}
.qs-scan input{flex:1;border:none;background:none;outline:none;font-size:14px;font-family:'IBM Plex Mono',monospace;color:var(--primary-dark);}
.qs-catbar{display:flex;gap:6px;overflow-x:auto;padding:8px 12px 6px;background:var(--surface);border-bottom:1px solid var(--border);}
.qs-cat{border:1.5px solid var(--border);border-radius:20px;padding:4px 12px;font-size:12px;font-weight:700;font-family:'Tajawal',sans-serif;background:#fff;color:var(--muted);cursor:pointer;white-space:nowrap;flex-shrink:0;}
.qs-cat.on{background:var(--primary);border-color:var(--primary);color:#fff;}
.qs-grid{flex:1;overflow-y:auto;padding:10px;display:grid;grid-template-columns:repeat(3,1fr);gap:8px;align-content:start;max-height:calc(100vh - 240px - env(safe-area-inset-bottom));}
.qs-tile{background:var(--surface);border-radius:14px;padding:11px 8px;text-align:center;cursor:pointer;box-shadow:var(--shadow);border:2px solid transparent;transition:border-color .1s,transform .1s;position:relative;}
.qs-tile:active{transform:scale(.95);border-color:var(--primary);}
.qs-tile.in-cart{border-color:var(--accent);}
.qs-tile.out{opacity:.4;pointer-events:none;}
.qt-badge{position:absolute;top:-6px;right:-6px;background:var(--accent);color:#fff;font-size:11px;font-weight:800;border-radius:20px;padding:1px 7px;font-family:'IBM Plex Mono',monospace;min-width:22px;}
.qt-name{font-size:11.5px;font-weight:700;line-height:1.3;margin-bottom:4px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
.qt-price{font-size:12px;font-family:'IBM Plex Mono',monospace;color:var(--primary);font-weight:700;}
.qt-stock{font-size:10px;color:var(--muted);margin-top:1px;}
.qs-bar{background:var(--surface);border-top:1.5px solid var(--border);padding:10px 12px calc(10px + env(safe-area-inset-bottom));display:flex;align-items:center;gap:10px;box-shadow:0 -4px 16px rgba(0,0,0,0.08);flex-shrink:0;}
.qs-total{flex:1;}
.qs-lbl{font-size:11px;color:var(--muted);}
.qs-amt{font-size:21px;font-weight:800;font-family:'IBM Plex Mono',monospace;color:var(--primary);}
.qs-cnt{font-size:11px;color:var(--muted);}
.qs-checkout{background:var(--accent);color:#fff;border:none;border-radius:13px;padding:14px 18px;font-size:14px;font-weight:700;font-family:'Tajawal',sans-serif;cursor:pointer;white-space:nowrap;}
.qs-checkout:disabled{opacity:.35;cursor:default;}

/* ══ TABLET / LANDSCAPE (≥700px) ══ */
@media(min-width:700px){
  body{background:var(--bg);}
  #app{max-width:100%;flex-direction:row;}

  /* Side navigation replaces bottom bar */
  .bnav{
    position:fixed;top:0;right:0;bottom:0;left:auto;
    flex-direction:column;justify-content:flex-start;
    width:82px;border-top:none;border-left:1px solid var(--border);
    padding:70px 0 20px;box-shadow:-4px 0 16px rgba(0,0,0,0.05);
    height:100vh;max-width:82px;transform:none;
  }
  .nb{padding:12px 4px;gap:4px;}
  .nb .ni{font-size:22px;}
  .nb .nl{font-size:9.5px;}
  .nb.active::after{content:"";position:absolute;top:20%;right:-1px;left:auto;bottom:auto;width:3px;height:60%;background:var(--primary);border-radius:3px 0 0 3px;}

  /* Topbar: leave space for right side-nav */
  .topbar{padding-right:calc(82px + 16px);}

  .page{padding:16px 24px 32px;}
  .fab{left:18px;right:auto;bottom:24px;transform:none;}
  .sheet{max-width:560px;}

  /* Dashboard & lists */
  .stat-grid{grid-template-columns:repeat(4,1fr);}
  .chart-wrap canvas{height:160px!important;}
  .li{border-radius:12px;}

  /* Products page: 2-column list */
  #pList, #page > div:first-child + div{display:block;}

  /* Quick sale tablet: full-screen POS split layout */
  .qs-wrap{flex-direction:row;height:calc(100vh - 56px);margin:-16px -24px -32px -24px;}
  .qs-products-col{flex:1;display:flex;flex-direction:column;overflow:hidden;}
  .qs-top{padding:12px 14px;}
  .qs-catbar{padding:8px 14px 6px;}
  .qs-grid{
    grid-template-columns:repeat(4,1fr);gap:10px;padding:12px 14px;
    max-height:none;flex:1;overflow-y:auto;
  }
  .qs-tile{padding:14px 10px;}
  .qt-name{font-size:12.5px;}
  .qt-price{font-size:13px;}
  .qt-stock{font-size:11px;}

  /* Cart side panel */
  .qs-cart-panel{
    width:300px;flex-shrink:0;
    border-right:1.5px solid var(--border);
    display:flex;flex-direction:column;
    background:var(--surface);
  }
  .qs-cart-header{
    padding:14px 14px 10px;font-weight:800;font-size:15px;
    border-bottom:1px solid var(--border);display:flex;align-items:center;gap:8px;
  }
  .qs-cart-items{flex:1;overflow-y:auto;padding:6px 0;}
  .qs-cart-item-row{
    display:flex;align-items:center;gap:8px;
    padding:10px 14px;border-bottom:1px solid var(--border);
  }
  .qci-name{flex:1;font-size:12.5px;font-weight:700;line-height:1.35;}
  .qci-controls{display:flex;align-items:center;gap:5px;}
  .qci-btn{width:26px;height:26px;border-radius:8px;border:1.5px solid var(--border);background:#fff;font-size:14px;cursor:pointer;display:flex;align-items:center;justify-content:center;}
  .qci-qty{font-size:14px;font-weight:800;font-family:'IBM Plex Mono',monospace;min-width:20px;text-align:center;}
  .qci-price{font-size:11.5px;font-family:'IBM Plex Mono',monospace;color:var(--muted);min-width:60px;text-align:left;}
  .qs-cart-footer{
    padding:12px 14px calc(12px + env(safe-area-inset-bottom));
    border-top:1.5px solid var(--border);background:var(--surface);
  }
  /* Hide mobile-only bar on tablet */
  .qs-bar-mobile{display:none;}
}

/* ── Universal Storage (IndexedDB → localStorage → memory) ── */
const Store = (() => {
  const DB_NAME = 'tajer-db', DB_VER = 1, STORE = 'kv';
  let _db = null;

  async function getDB() {
    if (_db) return _db;
    return new Promise((res, rej) => {
      const req = indexedDB.open(DB_NAME, DB_VER);
      req.onupgradeneeded = e => e.target.result.createObjectStore(STORE, { keyPath: 'k' });
      req.onsuccess = e => { _db = e.target.result; res(_db); };
      req.onerror = () => rej(req.error);
    });
  }

  async function idbGet(key) {
    try {
      const db = await getDB();
      return new Promise((res, rej) => {
        const tx = db.transaction(STORE, 'readonly');
        const req = tx.objectStore(STORE).get(key);
        req.onsuccess = () => res(req.result?.v ?? null);
        req.onerror = () => rej(req.error);
      });
    } catch (e) { return localStorage.getItem(key); }
  }

  async function idbSet(key, val) {
    try {
      const db = await getDB();
      return new Promise((res, rej) => {
        const tx = db.transaction(STORE, 'readwrite');
        tx.objectStore(STORE).put({ k: key, v: val });
        tx.oncomplete = () => res();
        tx.onerror = () => rej(tx.error);
      });
    } catch (e) { localStorage.setItem(key, val); }
  }

  async function idbDel(key) {
    try {
      const db = await getDB();
      return new Promise((res, rej) => {
        const tx = db.transaction(STORE, 'readwrite');
        tx.objectStore(STORE).delete(key);
        tx.oncomplete = () => res();
        tx.onerror = () => rej(tx.error);
      });
    } catch (e) { localStorage.removeItem(key); }
  }

  return { get: idbGet, set: idbSet, del: idbDel };
})();

/* ══════════════════════════════════════════════
   BARCODE SCANNER — native getUserMedia + BarcodeDetector + Quagga fallback
══════════════════════════════════════════════ */
let _scanStream = null;
let _scanAnim   = null;
let _quaggaOn   = false;

function stopQrScanner(){
  if(_scanAnim){ cancelAnimationFrame(_scanAnim); _scanAnim=null; }
  if(_quaggaOn){ try{ Quagga.stop(); }catch(e){} _quaggaOn=false; }
  if(_scanStream){ _scanStream.getTracks().forEach(t=>t.stop()); _scanStream=null; }
}

function openBarcodeScanner(onResult){
  const vid='scan-vid-'+Date.now();
  openSheet(`
    <h3>مسح الباركود 📷</h3>
    <div id="scanWrap" style="position:relative;width:100%;background:#111;border-radius:14px;overflow:hidden;min-height:200px;">
      <video id="${vid}" autoplay playsinline muted style="width:100%;display:block;max-height:240px;object-fit:cover;"></video>
      <div style="position:absolute;inset:15% 8%;border:2.5px solid rgba(217,138,30,.9);border-radius:10px;pointer-events:none;box-shadow:0 0 0 2000px rgba(0,0,0,.35);"></div>
      <div id="scanFps" style="position:absolute;bottom:6px;right:8px;font-size:10px;color:rgba(255,255,255,.5);"></div>
    </div>
    <p id="scanMsg" style="font-size:12.5px;color:var(--muted);text-align:center;margin:8px 0 4px;">⏳ جارٍ تشغيل الكاميرا...</p>
    <div class="field" style="margin-top:10px;">
      <label>أو أدخل الباركود يدوياً</label>
      <div class="bc-row">
        <input id="manualCode" class="mono" placeholder="اكتب الرقم ثم اضغط ✓" autocomplete="off" inputmode="text">
        <button class="icon-btn primary" id="manualOk">✓</button>
      </div>
    </div>
    <button class="btn btn-ghost" id="cancelScan" style="margin-top:8px;">إغلاق</button>
  `, async ov=>{
    let stopped=false;
    const setMsg=(txt,color='var(--muted)')=>{ const el=ov.querySelector('#scanMsg'); if(el){el.textContent=txt;el.style.color=color;} };

    const done=(code)=>{
      if(stopped) return;
      stopped=true; stopQrScanner(); closeSheet(); onResult(code);
    };

    ov.querySelector('#cancelScan').onclick=()=>{ stopped=true; stopQrScanner(); closeSheet(); };
    ov.querySelector('#manualOk').onclick=()=>{ const v=ov.querySelector('#manualCode').value.trim(); if(v) done(v); else toast('أدخل رمزاً صحيحاً'); };
    ov.querySelector('#manualCode').onkeydown=e=>{ if(e.key==='Enter'){e.preventDefault();ov.querySelector('#manualOk').click();} };

    // ── Check for camera support ──
    if(!navigator.mediaDevices?.getUserMedia){
      setMsg('⚠️ المتصفح لا يدعم الكاميرا — استخدم Chrome أو الإدخال اليدوي','var(--danger)');
      return;
    }

    // ── Start camera ──
    let videoEl;
    try{
      _scanStream = await navigator.mediaDevices.getUserMedia({
        video:{ facingMode:'environment', width:{ideal:1280}, height:{ideal:720} }
      });
      if(stopped){ stopQrScanner(); return; }
      videoEl = ov.querySelector('#'+vid);
      videoEl.srcObject = _scanStream;
      await videoEl.play().catch(()=>{});
      setMsg('وجّه الكاميرا نحو الباركود 📦');
    }catch(e){
      const denied = e?.name==='NotAllowedError'||e?.name==='PermissionDeniedError';
      setMsg(denied
        ? '🚫 تم رفض إذن الكاميرا — افتح إعدادات المتصفح واسمح للموقع بالكاميرا'
        : '⚠️ تعذّر فتح الكاميرا ('+( e?.message||e?.name||'خطأ غير معروف')+')',
        'var(--danger)');
      return;
    }

    // ── Method 1: Native BarcodeDetector (Chrome Android/Desktop, Edge, Samsung) ──
    if('BarcodeDetector' in window){
      try{
        const formats = await BarcodeDetector.getSupportedFormats().catch(()=>
          ['code_128','code_39','ean_13','ean_8','upc_a','upc_e','qr_code']
        );
        const detector = new BarcodeDetector({formats});
        let lastScan=0;
        const loop=async()=>{
          if(stopped) return;
          if(videoEl.readyState >= 2){
            try{
              const codes=await detector.detect(videoEl);
              if(codes.length){ done(codes[0].rawValue); return; }
            }catch(e){}
          }
          _scanAnim=requestAnimationFrame(loop);
        };
        _scanAnim=requestAnimationFrame(loop);
        setMsg('✅ الكاميرا جاهزة — وجّه نحو الباركود');
        return; // done via loop
      }catch(e){ /* fall through to Quagga */ }
    }

    // ── Method 2: Quagga.js (wider browser support) ──
    if(typeof Quagga !== 'undefined'){
      setMsg('🔍 جارٍ التعرف على الباركود...');
      try{
        const wrap=ov.querySelector('#scanWrap');
        // Remove our video (Quagga creates its own)
        videoEl.remove();
        Quagga.init({
          inputStream:{
            type:'LiveStream', target:wrap,
            constraints:{facingMode:'environment', width:640, height:480},
          },
          decoder:{ readers:['code_128_reader','code_39_reader','ean_reader','ean_8_reader','upc_reader','upc_e_reader','i2of5_reader'] },
          locate:true,
          numOfWorkers:2,
        }, err=>{
          if(stopped) return;
          if(err){ setMsg('⚠️ خطأ Quagga: '+err,'var(--danger)'); return; }
          _quaggaOn=true;
          Quagga.start();
          setMsg('✅ الكاميرا جاهزة — وجّه نحو الباركود');
          Quagga.onDetected(res=>{
            if(stopped) return;
            const code=res?.codeResult?.code;
            if(code){ done(code); }
          });
        });
      }catch(e){ setMsg('⚠️ خطأ في المسح — استخدم الإدخال اليدوي','var(--danger)'); }
      return;
    }

    // ── Method 3: Manual only (no decoder available) ──
    setMsg('ℹ️ الكاميرا تعمل لكن لا يوجد محرك مسح — استخدم الإدخال اليدوي أو قارئ خارجي');
    ov.querySelector('#manualCode').focus();
  });
}

function openProductForm(p){
  const ie=!!p; let cb=ie?(p.barcode||''):'';
  openSheet(`
    <h3>${ie?'تعديل منتج':'منتج جديد'}</h3>
    <div class="field"><label>اسم المنتج</label><input id="fN" value="${ie?esc(p.name):''}"></div>
    <div class="field"><label>الفئة</label><input id="fC" value="${ie?esc(p.category||''):''}"></div>
    <div class="field"><label>الباركود</label>
      <div class="bc-row"><input id="fB" class="mono" value="${esc(cb)}" placeholder="أدخل أو ولّد"><button class="icon-btn" id="fScn">📷</button><button class="icon-btn" id="fGn">🎲</button></div>
      <div class="bc-prev" id="bPrev"></div>
    </div>
    <div class="r2">
      <div class="field"><label>سعر الشراء</label><input id="fCo" type="number" value="${ie?p.costPrice:''}"></div>
      <div class="field"><label>سعر البيع</label><input id="fSe" type="number" value="${ie?p.sellPrice:''}"></div>
    </div>
    <div class="r2">
      <div class="field"><label>الكمية</label><input id="fSt" type="number" value="${ie?p.stock:''}"></div>
      <div class="field"><label>الوحدة</label><input id="fU" value="${ie?esc(p.unit||''):'قطعة'}"></div>
    </div>
    <div class="field"><label>حد التنبيه</label><input id="fM" type="number" value="${ie?p.minStock:'5'}"></div>
    ${ie?'<button class="btn btn-ghost" id="fPL" style="margin-bottom:10px;">🖨️ طباعة ملصق الباركود</button>':''}
    <div class="r2">${ie?'<button class="btn btn-danger" id="fD">حذف</button>':''}<button class="btn btn-primary" id="fS">${ie?'حفظ':'إضافة'}</button></div>
  `,ov=>{
    const bInp=ov.querySelector('#fB'), prev=ov.querySelector('#bPrev');
    const rfPrev=()=>{prev.innerHTML='';const v=bInp.value.trim();if(!v)return;const s=document.createElementNS('http://www.w3.org/2000/svg','svg');prev.appendChild(s);renderBarcodeSvg(s,v);};
    rfPrev(); bInp.oninput=rfPrev;
    ov.querySelector('#fScn').onclick=()=>openBarcodeScanner(code=>{const dup=findProductByBarcode(code);if(dup&&(!ie||dup.id!==p.id)){toast('⚠️ باركود مستخدم: '+dup.name);}else{bInp.value=code;rfPrev();}});
    ov.querySelector('#fGn').onclick=()=>{bInp.value=generateBarcodeValue();rfPrev();};
    if(ie){ov.querySelector('#fPL').onclick=()=>printBarcodeLabel(p.name,Number(ov.querySelector('#fSe').value)||p.sellPrice,bInp.value.trim());}
    ov.querySelector('#fS').onclick=()=>{
      const name=ov.querySelector('#fN').value.trim(); if(!name)return toast('أدخل اسم المنتج');
      const bc=bInp.value.trim(); const dup=findProductByBarcode(bc);
      if(bc&&dup&&(!ie||dup.id!==p.id))return toast('⚠️ هذا الباركود مستخدم لمنتج آخر');
      const obj={id:ie?p.id:uid(),name,category:ov.querySelector('#fC').value.trim(),barcode:bc,costPrice:Number(ov.querySelector('#fCo').value)||0,sellPrice:Number(ov.querySelector('#fSe').value)||0,stock:Number(ov.querySelector('#fSt').value)||0,unit:ov.querySelector('#fU').value.trim()||'قطعة',minStock:Number(ov.querySelector('#fM').value)||0};
      if(ie)Object.assign(p,obj); else DATA.products.push(obj);
      saveData();closeSheet();renderProducts();toast('تم الحفظ ✓');
    };
    if(ie){ov.querySelector('#fD').onclick=()=>{closeSheet();confirmAction('سيتم حذف هذا المنتج نهائياً.',()=>{DATA.products=DATA.products.filter(x=>x.id!==p.id);saveData();renderProducts();toast('تم الحذف');});};}
  });
}

function renderPurchaseNew(){
  setHeader('عملية شراء جديدة',true);
  const sid=route.params.supplierId; let cart=[];
  function tot(){return cart.reduce((s,i)=>s+i.qty*i.cost,0);}
  function draw(){
    document.getElementById('page').innerHTML=`
      <div class="field"><label>اختر منتجاً</label><select id="prSel"><option value="">اختر...</option>${DATA.products.map(p=>`<option value="${p.id}">${esc(p.name)}</option>`).join('')}</select></div>
      <div class="sec"><span>المنتجات (${cart.length})</span></div>
      <div id="cList">${cart.map((it,i)=>`<div class="cart-item"><div style="flex:1"><div style="font-weight:700;font-size:13px;">${esc(it.name)}</div><div style="font-size:11px;color:var(--muted);">سعر الشراء: <input data-ci="${i}" type="number" value="${it.cost}" style="width:60px;border:1px solid var(--border);border-radius:6px;padding:2px 4px;font-family:monospace;"></div></div><input class="qty-inp" data-qi="${i}" type="number" min="1" value="${it.qty}" inputmode="numeric"><div class="mono" style="min-width:70px;text-align:left;">${fmtMoney(it.qty*it.cost)}</div></div>`).join('')||'<p style="text-align:center;color:var(--muted);padding:16px 0;font-size:13px;">أضف منتجات</p>'}</div>
      <div class="card" style="margin-top:12px;"><div class="kv" style="font-size:15px;"><span class="k">الإجمالي</span><span class="v">${fmtMoney(tot())}</span></div><div class="field" style="margin-top:8px;"><label>المدفوع الآن</label><input id="pAmt" type="number" value="${tot()}"></div></div>
      <button class="btn btn-primary" id="svP">💾 حفظ عملية الشراء</button>`;
    document.getElementById('prSel').onchange=e=>{const pid=e.target.value;if(!pid)return;const pr=DATA.products.find(p=>p.id===pid);const ex=cart.find(c=>c.productId===pid);if(ex)ex.qty++;else cart.push({productId:pid,name:pr.name,qty:1,cost:pr.costPrice||0});draw();};
    document.querySelectorAll('[data-qi]').forEach(inp=>inp.onchange=()=>{const v=Number(inp.value)||1;v<=0?cart.splice(inp.dataset.qi,1):cart[inp.dataset.qi].qty=v;draw();});
    document.querySelectorAll('[data-ci]').forEach(inp=>inp.onchange=()=>{cart[inp.dataset.ci].cost=Number(inp.value)||0;draw();});
    document.getElementById('svP').onclick=()=>{
      if(!cart.length)return toast('أضف منتجات');
      const total=tot(),paid=Math.min(Number(document.getElementById('pAmt').value)||0,total);
      const pur={id:uid(),supplierId:sid,date:nowISO(),items:cart.map(c=>({productId:c.productId,name:c.name,qty:c.qty,cost:c.cost})),total,paid};
      DATA.purchases.push(pur);
      cart.forEach(c=>{const pr=DATA.products.find(p=>p.id===c.productId);if(pr){pr.stock+=c.qty;pr.costPrice=c.cost;}});

    };
  }

}

function renderSaleNew(){
  setHeader('فاتورة بيع جديدة',true);
  let cart=[],custId=route.params.customerId||'',payMode='full',prSrc='';
  function tot(){return Math.max(0,cart.reduce((s,i)=>s+i.qty*i.price,0));}
  function draw(){
    const fps=DATA.products.filter(p=>p.name.toLowerCase().includes(prSrc.toLowerCase())||(p.barcode||'').includes(prSrc));
    document.getElementById('page').innerHTML=`
      <div class="scan-strip">
        <span>📷</span>
        <input id="bcI" class="mono" placeholder="امسح أو اكتب الباركود ثم Enter" autocomplete="off">
        <button class="icon-btn primary" id="bcCam">🎥</button>
      </div>
      <div class="field"><label>العميل</label><select id="cuSel"><option value="">عميل عابر</option>${DATA.customers.map(c=>`<option value="${c.id}"${c.id===custId?' selected':''}>${esc(c.name)}</option>`).join('')}</select></div>
      <div class="search" style="margin-bottom:8px;"><span>🔍</span><input id="prSrc" placeholder="ابحث عن منتج لإضافته..." value="${esc(prSrc)}"></div>
      <div style="max-height:150px;overflow-y:auto;margin-bottom:10px;">
        ${fps.slice(0,25).map(p=>`<div class="pick-row" data-pk="${p.id}" style="cursor:pointer;"><span style="font-size:13px;">${esc(p.name)} <span style="color:var(--muted);font-size:11px;">(${p.stock})</span></span><span class="mono" style="font-size:12px;color:var(--primary);font-weight:700;">${fmtMoney(p.sellPrice)} ＋</span></div>`).join('')||'<p style="font-size:12px;color:var(--muted);text-align:center;padding:8px;">لا نتائج</p>'}
      </div>
      <div class="sec"><span>السلة (${cart.length} منتج)</span></div>
      ${cart.map((it,i)=>`<div class="cart-item"><div style="flex:1"><div style="font-weight:700;font-size:13px;">${esc(it.name)}</div><div style="font-size:11px;color:var(--muted);">السعر: <input data-pi="${i}" type="number" value="${it.price}" style="width:55px;border:1px solid var(--border);border-radius:6px;padding:2px 4px;font-family:monospace;"></div></div><input class="qty-inp" data-qs="${i}" type="number" min="1" value="${it.qty}" inputmode="numeric"><div class="mono" style="min-width:70px;text-align:left;">${fmtMoney(it.qty*it.price)}</div></div>`).join('')}
      <div class="card" style="margin-top:12px;">
        <div class="field"><label>خصم</label><input id="dscAmt" type="number" placeholder="0" value="0" min="0"></div>
        <div class="kv" style="font-size:15px;"><span class="k">الإجمالي</span><span class="v">${fmtMoney(tot())}</span></div>
        <label style="font-size:12px;color:var(--muted);font-weight:700;display:block;margin:10px 0 5px;">حالة الدفع</label>
        <div class="seg"><button data-m="full" class="${payMode==='full'?'on':''}">دفع كامل</button><button data-m="partial" class="${payMode==='partial'?'on':''}">جزئي</button><button data-m="credit" class="${payMode==='credit'?'on':''}">دين</button></div>
        ${payMode==='partial'?`<div class="field" style="margin-top:10px;"><label>المدفوع</label><input id="ptAmt" type="number" placeholder="0"></div>`:''}
      </div>
      <button class="btn btn-primary" id="svI" style="margin-top:10px;">💾 حفظ الفاتورة</button>`;
    const bcI=document.getElementById('bcI');bcI.focus();
    const addByCode=code=>{const pr=findProductByBarcode(code);if(!pr)return toast('⚠️ لا يوجد منتج بهذا الباركود: '+code);const ex=cart.find(c=>c.productId===pr.id);if(ex)ex.qty++;else cart.push({productId:pr.id,name:pr.name,qty:1,price:pr.sellPrice||0});toast('✓ '+pr.name);draw();document.getElementById('bcI').focus();};
    bcI.onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();const v=bcI.value.trim();if(v)addByCode(v);bcI.value='';}};
    document.getElementById('bcCam').onclick=()=>openBarcodeScanner(addByCode);
    document.getElementById('cuSel').onchange=e=>{custId=e.target.value;};
    document.getElementById('prSrc').oninput=e=>{prSrc=e.target.value;draw();document.getElementById('prSrc').focus();};
    document.querySelectorAll('[data-pk]').forEach(el=>el.onclick=()=>{const pr=DATA.products.find(p=>p.id===el.dataset.pk);const ex=cart.find(c=>c.productId===pr.id);if(ex)ex.qty++;else cart.push({productId:pr.id,name:pr.name,qty:1,price:pr.sellPrice||0});draw();});
    document.querySelectorAll('[data-qs]').forEach(inp=>inp.onchange=()=>{const v=Number(inp.value)||1;v<=0?cart.splice(inp.dataset.qs,1):cart[inp.dataset.qs].qty=v;draw();});
    document.querySelectorAll('[data-pi]').forEach(inp=>inp.onchange=()=>{cart[inp.dataset.pi].price=Number(inp.value)||0;draw();});
    document.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>{payMode=b.dataset.m;draw();});
    document.getElementById('svI').onclick=()=>{
      if(!cart.length)return toast('السلة فارغة');
      for(const it of cart){const pr=DATA.products.find(p=>p.id===it.productId);if(pr&&it.qty>pr.stock)return toast(`الكمية المتوفرة من "${pr.name}" غير كافية (${pr.stock})`);}
      const disc=Math.max(0,Number(document.getElementById('dscAmt').value)||0);
      const grand=Math.max(0,tot()-disc);
      let paid=grand;
      if(payMode==='credit')paid=0;
      if(payMode==='partial')paid=Math.min(Number(document.getElementById('ptAmt')?.value)||0,grand);
      const inv={id:uid(),number:DATA.settings.nextInvoiceNo||1,date:nowISO(),customerId:custId||null,items:cart.map(c=>({productId:c.productId,name:c.name,qty:c.qty,price:c.price})),discount:disc,total:grand,paid};
      DATA.settings.nextInvoiceNo=(DATA.settings.nextInvoiceNo||1)+1;
      DATA.invoices.push(inv);
      cart.forEach(it=>{const pr=DATA.products.find(p=>p.id===it.productId);if(pr)pr.stock-=it.qty;});
      if(custId&&paid<grand){const cu=DATA.customers.find(c=>c.id===custId);if(cu)cu.balance=(cu.balance||0)+(grand-paid);}
      saveData();toast('تم حفظ الفاتورة ✓');go('saleDetail',{id:inv.id},false);
    };
  }
  draw();
}

function renderReports(){

  const dayTotals=days.map(d=>{const nx=new Date(d);nx.setDate(nx.getDate()+1);return DATA.invoices.filter(i=>{const t=new Date(i.date);return t>=d&&t<nx;}).reduce((s,i)=>s+i.total,0);});
  const totalRev=DATA.invoices.reduce((s,i)=>s+i.total,0);
  const totalProfit=DATA.invoices.reduce((s,inv)=>s+inv.items.reduce((ss,it)=>{const p=DATA.products.find(x=>x.id===it.productId);return ss+(it.price-(p?p.costPrice:0))*it.qty;},0),0);

      <div class="stat-card ${totalDebt>0?'sc-alert':''}"><div class="sc-icon">💳</div><div class="sc-val">${fmtMoney(totalDebt)}</div><div class="sc-label">ديون العملاء</div></div>
    </div>
    <div class="chart-wrap">
      <div style="font-size:12.5px;font-weight:700;color:var(--ink-2);margin-bottom:10px;">📊 المبيعات — آخر 30 يوماً</div>
      <canvas id="lineChart" height="140"></canvas>
    </div>
    ${top.length?`<div class="chart-wrap"><div style="font-size:12.5px;font-weight:700;color:var(--ink-2);margin-bottom:10px;">🏆 أكثر المنتجات مبيعاً</div><canvas id="pieChart" height="200"></canvas></div>`:''}
    <button class="btn btn-primary" id="expRep" style="margin-top:4px;">⬇️ تصدير التقرير (HTML قابل للطباعة)</button>
  `;
  mkChart('lineChart',{type:'bar',data:{labels:days.filter((_,i)=>i%3===0).map(d=>d.toLocaleDateString('ar-DZ',{day:'numeric',month:'numeric'})),datasets:[{data:dayTotals.filter((_,i)=>i%3===0),backgroundColor:'rgba(11,94,71,0.15)',borderColor:'#0B5E47',borderWidth:2,borderRadius:5,type:'bar'},{data:dayTotals.filter((_,i)=>i%3===0),type:'line',borderColor:'#D98A1E',borderWidth:2,pointRadius:0,tension:0.4,fill:false}]},options:{responsive:true,plugins:{legend:{display:false}},scales:{y:{beginAtZero:true,grid:{color:'#E4EEE9'},ticks:{callback:v=>v>=1000?(v/1000).toFixed(1)+'k':v}},x:{grid:{display:false}}}}});
  if(top.length){
    mkChart('pieChart',{type:'doughnut',data:{labels:top.map(t=>t[0].slice(0,12)),datasets:[{data:top.map(t=>t[1]),backgroundColor:['#0B5E47','#D98A1E','#0E7558','#BF3A2A','#3D8B6B','#8B6B3D'],borderWidth:0}]},options:{responsive:true,plugins:{legend:{position:'bottom',labels:{font:{family:'Tajawal',size:11},padding:10}}}}});
  }

    <div id="slErr" style="color:var(--danger);font-size:12px;min-height:16px;margin-bottom:10px;"></div>

  `,ov=>{

      DATA.settings.license={key:inp.value.trim().toUpperCase(),tier:result.tier,tierName:result.tierName,expiry:result.expiry.toISOString(),daysLeft:result.daysLeft,activatedAt:nowISO()};
      saveData();

function renderQuickSale(){

  document.getElementById('page').style.paddingBottom = '0';
  document.getElementById('page').style.padding = '0';

  let disc = 0, custId = '', payMode = 'cash';
  const cats = ['الكل', ...new Set(DATA.products.map(p=>p.category||'أخرى').filter(Boolean))];
  const isTablet = () => window.innerWidth >= 700;

  function cartItems(){ return Object.entries(cart).map(([id,qty])=>{const p=DATA.products.find(x=>x.id===id);return p?{productId:id,name:p.name,qty,price:p.sellPrice}:null;}).filter(Boolean); }
  function cartTotal(){ return Math.max(0,cartItems().reduce((s,it)=>s+it.qty*it.price,0)-disc); }

            <div class="qci-controls">

                <input id="qsBC" class="mono" placeholder="امسح الباركود أو اكتبه ثم Enter" autocomplete="off">

    if(!isTablet()) return;
    const panel = document.getElementById('qsCartPanel');
    if(panel) panel.innerHTML = cartPanelHTML();
    wireCartPanel();
  }
  function updateMobileBar(){
    const bar=document.querySelector('.qs-amt');
    const lbl=document.querySelector('.qs-lbl');
    const co=document.getElementById('qsCO');
    if(bar) bar.textContent=fmtMoney(cartTotal());

    if(co)  co.disabled=!cartCount();
  }

  function addToCart(pid){
    const prod=DATA.products.find(p=>p.id===pid);
    if(!prod||prod.stock<=0)return;
    if((cart[pid]||0)>=prod.stock){toast('⚠️ وصلت لأقصى كمية');return;}
    cart[pid]=(cart[pid]||0)+1;
    // Update tile badge without full redraw
    const tile=document.querySelector(`[data-pid="${pid}"]`);
    if(tile){
      const q=cart[pid];
      tile.classList.add('in-cart');
      let badge=tile.querySelector('.qt-badge');
      if(badge)badge.textContent='×'+q;
      else{const b=document.createElement('span');b.className='qt-badge';b.textContent='×'+q;tile.appendChild(b);}
    }
    if(isTablet()) refreshCartPanel(); else updateMobileBar();
  }
  function removeFromCart(pid){
    if(!cart[pid])return;
    cart[pid]--;
    if(cart[pid]<=0)delete cart[pid];
    const tile=document.querySelector(`[data-pid="${pid}"]`);
    if(tile){
      if(!cart[pid]){tile.classList.remove('in-cart');const b=tile.querySelector('.qt-badge');if(b)b.remove();}
      else{const b=tile.querySelector('.qt-badge');if(b)b.textContent='×'+cart[pid];}
    }
    if(isTablet()) refreshCartPanel(); else updateMobileBar();
  }

  function finalizeSale(cId,discount,pMode){
    const items=cartItems();
    if(!items.length)return toast('السلة فارغة');
    for(const it of items){const p=DATA.products.find(x=>x.id===it.productId);if(p&&it.qty>p.stock)return toast(`الكمية غير كافية: "${p.name}" (${p.stock})`);}
    const total=Math.max(0,items.reduce((s,it)=>s+it.qty*it.price,0)-discount);
    const paid=pMode==='cash'?total:0;
    const inv={id:uid(),number:DATA.settings.nextInvoiceNo||1,date:nowISO(),customerId:cId||null,items,discount,total,paid};
    DATA.settings.nextInvoiceNo=(DATA.settings.nextInvoiceNo||1)+1;
    DATA.invoices.push(inv);
    items.forEach(it=>{const p=DATA.products.find(x=>x.id===it.productId);if(p)p.stock-=it.qty;});
    if(cId&&paid<total){const cu=DATA.customers.find(c=>c.id===cId);if(cu)cu.balance=(cu.balance||0)+(total-paid);}
    saveData();
    cart={};disc=0;custId='';payMode='cash';
    toast('✓ تم البيع — فاتورة #'+String(inv.number).padStart(4,'0'));
    draw();
    setTimeout(()=>{
      openSheet(`<h3>طباعة الفاتورة؟</h3><p style="font-size:13px;color:var(--muted);margin-bottom:16px;">فاتورة #${String(inv.number).padStart(4,'0')} — ${fmtMoney(total)}</p><div class="r2"><button class="btn btn-ghost" id="sk">تخطي</button><button class="btn btn-primary" id="pr">🖨️ طباعة</button></div>`,ov2=>{ov2.querySelector('#sk').onclick=closeSheet;ov2.querySelector('#pr').onclick=()=>{closeSheet();printThermalReceipt(inv);};});

    // Tiles

    // Mobile checkout button
    const mCO=document.getElementById('qsCO');
    if(mCO) mCO.onclick=()=>{
      openSheet(`
        <h3>⚡ إتمام البيع السريع</h3>
        <div class="card" style="margin-bottom:12px;">
          ${cartItems().map(it=>`<div class="kv"><span class="k">${esc(it.name)} ×${it.qty}</span><span class="v">${fmtMoney(it.qty*it.price)}</span></div>`).join('')}
          <div class="divider"></div>
          <div class="kv" style="font-size:15px;"><span style="font-weight:700;">الإجمالي</span><span class="v" style="font-size:17px;">${fmtMoney(cartTotal())}</span></div>
        </div>
        <div class="field"><label>العميل</label><select id="mCoC"><option value="">عميل عابر</option>${DATA.customers.map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join('')}</select></div>
        <div class="field"><label>الخصم</label><input id="mCoD" type="number" value="0" min="0" placeholder="0"></div>
        <div class="seg" style="margin-bottom:12px;">
          <button data-mpm="cash" class="on">💵 نقداً</button>
          <button data-mpm="credit">📋 دين</button>
        </div>
        <div class="r2">
          <button class="btn btn-ghost" id="mCan">إلغاء</button>
          <button class="btn btn-primary" id="mConf" style="background:var(--accent);">✓ تأكيد</button>

          ov.querySelector('#mConf').onclick=()=>{

  draw();
  // Re-draw on resize (tablet ↔ mobile)

}

function emptyState(icon,title,sub){ return `<div class="empty"><div class="ei">${icon}</div><div class="et">${title}</div>${sub?`<div class="es">${sub}</div>`:''}</div>`; }

/* ══════════════════════════════════════════════
   LICENSE ENGINE  (HMAC-SHA256)
══════════════════════════════════════════════ */
// ⚠️ غيّر هذا المفتاح السري قبل توزيع التطبيق — يجب أن يكون نفس المفتاح في أداة توليد التراخيص
const LICENSE_SECRET = 'TJR-8hmvzGnHNvms-JNW5MunRCBSC-fuGYVNaNhkxD';
const TRIAL_DAYS = 14;
const TIER_NAMES = {PR:'احترافي', BS:'أساسي', TR:'تجريبي'};

async function hmac8(data){
  try{
    const enc=new TextEncoder();
    const key=await crypto.subtle.importKey('raw',enc.encode(LICENSE_SECRET),{name:'HMAC',hash:'SHA-256'},false,['sign']);
    const sig=await crypto.subtle.sign('HMAC',key,enc.encode(data));
    return Array.from(new Uint8Array(sig)).slice(0,4).map(b=>b.toString(16).padStart(2,'0')).join('').toUpperCase();
  }catch(e){ return null; }
}

async function parseLicense(keyStr){
  if(!keyStr) return {valid:false,error:'أدخل مفتاح الترخيص'};
  const parts=keyStr.toUpperCase().trim().split('-');
  if(parts.length!==4||parts[0]!=='TAJER') return {valid:false,error:'صيغة المفتاح غير صحيحة — مثال: TAJER-PR-261231-ABCD1234'};
  const [,tier,ymd,sig]=parts;
  if(!['PR','BS','TR'].includes(tier)) return {valid:false,error:'نوع الترخيص غير معروف (PR / BS / TR)'};
  if(!/^\d{6}$/.test(ymd)) return {valid:false,error:'تاريخ الانتهاء في المفتاح غير صحيح'};
  const yr=2000+parseInt(ymd.slice(0,2)),mo=parseInt(ymd.slice(2,4))-1,dy=parseInt(ymd.slice(4,6));
  const expiry=new Date(yr,mo,dy,23,59,59);
  if(isNaN(expiry.getTime())) return {valid:false,error:'تاريخ انتهاء غير صحيح في المفتاح'};
  const daysLeft=Math.ceil((expiry-new Date())/864e5);
  const expected=await hmac8(tier+ymd);
  if(!expected) return {valid:false,error:'خطأ في التحقق — تأكد من دعم المتصفح للتشفير'};
  if(sig!==expected) return {valid:false,error:'المفتاح غير صحيح أو تالف — تأكد من نسخه كاملاً'};
  if(daysLeft<0) return {valid:false,expired:true,expiry,daysLeft,tier,error:`انتهت صلاحية هذا المفتاح في ${expiry.toLocaleDateString('ar-DZ')}`};
  return {valid:true,tier,tierName:TIER_NAMES[tier]||tier,expiry,daysLeft};
}

function trialDaysLeft(){
  const start=DATA.settings.trialStart;
  if(!start) return TRIAL_DAYS;
  return Math.ceil(TRIAL_DAYS-((Date.now()-new Date(start))/864e5));
}

function showLockScreen(){
  const ls=document.getElementById('lockScreen');
  ls.style.display='flex';
  document.getElementById('lockInput').value='';
  document.getElementById('lockErr').textContent='';
  checkActivation();
}

async function checkActivation(){
  // 1 — Already unlocked this session?
  try{
    const r=await Store.get(LIC_KEY);
    if(r==='1'){
      // Re-validate stored license on every load
      const lic=DATA.settings.license;
      if(lic){
        const dl=Math.ceil((new Date(lic.expiry)-new Date())/864e5);
        if(dl<0){ /* license expired */ }
        else{ lic.daysLeft=dl; document.getElementById('lockScreen').style.display='none'; showExpiryBanner(dl); return; }
      }
      // No license stored but flag exists — maybe trial
      if((DATA.settings.trialStart)&&trialDaysLeft()>0){
        document.getElementById('lockScreen').style.display='none';
        showExpiryBanner(trialDaysLeft(), true);
        return;
      }
    }
  }catch(e){}

  // 2 — First run: start trial automatically
  if(!DATA.settings.trialStart && !DATA.settings.license){
    DATA.settings.trialStart=nowISO();
    saveData();
  }

  // 3 — Active trial?
  const tLeft=trialDaysLeft();
  if(tLeft>0 && !DATA.settings.license){
    try{await Store.set(LIC_KEY,'1');}catch(e){}
    document.getElementById('lockScreen').style.display='none';
    showExpiryBanner(tLeft, true);
    return;
  }

  // 4 — Show lock screen
  const ls=document.getElementById('lockScreen');
  ls.style.display='flex';
  const icon=document.getElementById('lockIcon');
  const title=document.getElementById('lockTitle');
  const desc=document.getElementById('lockDesc');
  const trialBtn=document.getElementById('lockTrial');
  if(tLeft<=0&&!DATA.settings.license){
    if(icon) icon.textContent='⌛';
    if(title) title.textContent='انتهت فترة التجربة';
    if(desc) desc.textContent='أدخل مفتاح الترخيص المدفوع للاستمرار في استخدام التطبيق';
    if(trialBtn) trialBtn.style.display='none';
  } else {
    if(trialBtn) trialBtn.style.display='none'; // already used or not needed
  }

  const inp=document.getElementById('lockInput'),sub=document.getElementById('lockSubmit'),errEl=document.getElementById('lockErr');
  inp.focus();
  const doActivate=async()=>{
    sub.disabled=true; sub.textContent='جارٍ التحقق...';
    const result=await parseLicense(inp.value.trim());
    if(!result.valid){
      errEl.textContent=result.error;
      inp.classList.add('shake'); setTimeout(()=>inp.classList.remove('shake'),400);
      sub.disabled=false; sub.textContent='🔓 تفعيل'; inp.focus();
      return;
    }
    DATA.settings.license={key:inp.value.trim().toUpperCase(),tier:result.tier,tierName:result.tierName,expiry:result.expiry.toISOString(),daysLeft:result.daysLeft,activatedAt:nowISO()};
    saveData();
    try{await Store.set(LIC_KEY,'1');}catch(e){}
    ls.style.display='none';
    showExpiryBanner(result.daysLeft);
    toast(`✓ تم تفعيل ترخيص ${result.tierName} — متبقي ${result.daysLeft} يوم`);
  };
  sub.onclick=doActivate;
  inp.onkeydown=e=>{if(e.key==='Enter')doActivate();};

  const trB=document.getElementById('lockTrial');
  if(trB) trB.onclick=async()=>{
    if(!DATA.settings.trialStart) DATA.settings.trialStart=nowISO();
    saveData();
    try{await Store.set(LIC_KEY,'1');}catch(e){}
    ls.style.display='none';
    showExpiryBanner(trialDaysLeft(), true);
  };
}

function showExpiryBanner(daysLeft, isTrial=false){
  // Always remove any existing banner first
  document.querySelectorAll('.lic-banner').forEach(b=>b.remove());
  // If this is a trial call but a real license is now active → don't show
  if(isTrial && DATA.settings.license) return;
  // No banner needed when plenty of time remains
  if(daysLeft>30) return;
  const banner=document.createElement('div');
  banner.className='lic-banner';
  const urgent=daysLeft<=7;
  banner.style.cssText=`position:fixed;top:56px;right:0;left:0;z-index:19;text-align:center;padding:6px 14px;font-size:12px;font-weight:700;font-family:'Tajawal',sans-serif;cursor:pointer;${urgent?'background:var(--danger);color:#fff;':'background:var(--accent-soft);color:#7a4d0a;'}`;
  banner.textContent=isTrial
    ? `⏳ فترة التجربة المجانية — متبقي ${daysLeft} يوم${urgent?' — فعّل الترخيص الآن':''}`
    : `${urgent?'⚠️':'🔑'} ترخيصك ينتهي خلال ${daysLeft} يوم${urgent?' — جدّد الآن':''}`;
  banner.onclick=()=>go('settings');
  document.getElementById('app').appendChild(banner);
}

/* ══════════════════════════════════════════════
   INIT
══════════════════════════════════════════════ */
(async function init(){
  await loadData();
  render();
  checkActivation();
  if('serviceWorker' in navigator){try{await navigator.serviceWorker.register('sw.js');}catch(e){}}
})();
</script>
</body>
